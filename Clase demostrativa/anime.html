<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=}, initial-scale=1.0">
    <title>Animes Dennis</title>
    <link rel="stylesheet" href="anime.css">
    <link rel="stylesheet" href="https://www.flaticon.es/uicons/css/all.css">
</head>
<body>
    <!-- Encabezado -->
    <section class="encabezado">
        <div class="logo">
            <img
            id="logoAnime"
            alt="logo"
            height="35px"
            width="35px"
            src="https://i.pinimg.com/236x/f6/7c/7d/f67c7d51bf4c4a5aca091cce24f08f4d.jpg"
            >
        </div>
        <div>
            <ul>
                <li>Inicio</li>
                <li>Categoria</li>
                <li>Información</li>
                <li>Acerca de</li>
            </ul>
        </div>
        <div class="encDerecho">
            <div id="img1">
                <img
                alt="icoGH"
                width="25px"
                height="25px"
                src="img/github.png">
            </div>
            <div id="img1">
                <img
                alt="usuario"
                width="20px"
                height="20px"
                src="img/usuario.png">               
            </div>
        </div>
    </section>
    
    <!-- cuerpo -->
    <section class="cuerpo">
        <video autoplay muted loop playsinline class="video-fondo">
            <source src="video/animesVD.mp4" type="video/mp4">
            Tu navegador no soporta video HTML5.
        </video>

        <div class="contenido">
            <!-- Aquí puedes poner tu contenido encima del video -->
            <h1>ANIME DENNIS</h1>
            <p>El mejor contenido de anime.</p>
            <br>
        </div>
        <div class="btnPrincipal">
            <a id="btnPrincipal2"> Ver más</a>
        </div>
        
    </section>

</body>
</html>
