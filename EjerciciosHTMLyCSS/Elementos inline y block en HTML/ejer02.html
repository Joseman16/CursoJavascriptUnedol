<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elementos inline y block</title>
    <link rel="stylesheet" href="estiloEjer02.css">
  </head>
  <body>
    <h1>Elementos span (inline)</h1>
    <p>
        Texto donde vamos a <span style="color: red; border: 1px solid black"> enfatizar </span>
        y cambiar el
        <span style="color: darkslategrey; font-weight: bold">color de algunos elementos...</span>
    </p>
    <br>
    <h1>Elementos div (block)</h1>
    <div>
        <h2>Titulo del Div</h2>
        <p>Texto dentro del div</p>
    </div>
    <p>Texto fuera del div</p>
    
    </body>
</html>
